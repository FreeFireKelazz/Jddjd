name: Render Spine to MP4

on:
  workflow_dispatch:
    inputs:
      action_name:
        description: "Nama animasi Action"
        required: false
        default: "action"
      action_duration:
        description: "Paksa durasi action jadi sekian detik (0 = skip total, langsung loncat ke idle; kosongkan buat durasi asli)."
        required: false
        default: ""
      idle_name:
        description: "Nama animasi Idle"
        required: false
        default: "idle"
      idle_duration:
        description: "Paksa durasi idle jadi sekian detik (di-loop otomatis kalau lebih panjang dari durasi asli). Kosongkan buat pakai durasi asli animasinya."
        required: false
        default: ""
      fps:
        description: "FPS video"
        required: false
        default: "60"
      shards:
        description: "Jumlah runner paralel buat render frame"
        required: false
        default: "4"
      crf:
        description: "Kualitas video (0=lossless besar, 18=nyaris lossless, 23=seimbang, 28=lebih kecil)"
        required: false
        default: "23"
      preset:
        description: "Kecepatan encode (ultrafast..veryslow, makin lambat makin kecil filenya)"
        required: false
        default: "medium"
      scale_percent:
        description: "Skala resolusi akhir dalam % (100=asli, 50=setengah, dst). Turunin kalau video gak kebaca/lag di HP."
        required: false
        default: "50"
      max_dimension:
        description: "Batas sisi terpendek video, dalam pixel (aspect ratio tetap sama, sisi lain otomatis lebih besar)."
        required: false
        default: "2200"
      format:
        description: "Format output: 'mp4' (background hitam), 'webm' (background transparan, VP9, cuma kebaca di browser/PC tertentu), atau 'chromakey' (background warna solid pilihan sendiri, buat di-key manual di app editor)."
        required: false
        default: "webm"
      chroma_color:
        description: "Warna background kalau format=chromakey, hex 6-digit TANPA tanda # (contoh: 00B140 untuk hijau chroma standar)."
        required: false
        default: "00B140"

jobs:
  bounds:
    runs-on: ubuntu-latest
    outputs:
      total_frames: ${{ steps.read_bounds.outputs.total_frames }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: spine_renderer
        run: npm install
      - name: Deteksi folder asset (cari *.atlas)
        id: asset
        working-directory: spine_renderer
        run: |
          FOUND=$(find . -maxdepth 2 -iname "*.atlas" -not -path "./node_modules/*" -not -path "./output/*" | head -n1)
          if [ -z "$FOUND" ]; then
            echo "Tidak ada file .atlas ditemukan di dalam spine_renderer/*" >&2
            exit 1
          fi
          DIR=$(dirname "$FOUND")
          echo "path=${{ github.workspace }}/spine_renderer/$(basename "$DIR")" >> "$GITHUB_OUTPUT"
          echo "Asset folder terdeteksi: $DIR"
      - name: Hitung bounds
        working-directory: spine_renderer
        env:
          MODE: bounds
          ASSET: ${{ steps.asset.outputs.path }}
          BOUNDS_FILE: ${{ github.workspace }}/spine_renderer/output/bounds.json
          ACTION: ${{ github.event.inputs.action_name }}
          ACTION_DURATION: ${{ github.event.inputs.action_duration }}
          IDLE: ${{ github.event.inputs.idle_name }}
          IDLE_DURATION: ${{ github.event.inputs.idle_duration }}
          FPS: ${{ github.event.inputs.fps }}
        run: node render_mp4.js
      - name: Generate thumbnail (frame pertama, crop presisi)
        working-directory: spine_renderer
        env:
          MODE: thumbnail
          ASSET: ${{ steps.asset.outputs.path }}
          THUMBNAIL_OUT: ${{ github.workspace }}/spine_renderer/output/thumbnail.png
          ACTION: ${{ github.event.inputs.action_name }}
          ACTION_DURATION: ${{ github.event.inputs.action_duration }}
          IDLE: ${{ github.event.inputs.idle_name }}
          IDLE_DURATION: ${{ github.event.inputs.idle_duration }}
        run: node render_mp4.js
      - uses: actions/upload-artifact@v4
        with:
          name: character-thumbnail
          path: |
            spine_renderer/output/thumbnail.png
            spine_renderer/output/thumbnail_first.png
            spine_renderer/output/thumbnail_middle.png
            spine_renderer/output/thumbnail_last.png
          if-no-files-found: error
          retention-days: 90
        id: read_bounds
        run: echo "total_frames=$(node -pe 'JSON.parse(require("fs").readFileSync("spine_renderer/output/bounds.json")).totalFrames')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: bounds-data
          path: spine_renderer/output/bounds.json
          retention-days: 1

  frames:
    needs: bounds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: spine_renderer
        run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: bounds-data
          path: spine_renderer/output
      - name: Deteksi folder asset (cari *.atlas)
        id: asset
        working-directory: spine_renderer
        run: |
          FOUND=$(find . -maxdepth 2 -iname "*.atlas" -not -path "./node_modules/*" -not -path "./output/*" | head -n1)
          if [ -z "$FOUND" ]; then
            echo "Tidak ada file .atlas ditemukan di dalam spine_renderer/*" >&2
            exit 1
          fi
          DIR=$(dirname "$FOUND")
          echo "path=${{ github.workspace }}/spine_renderer/$(basename "$DIR")" >> "$GITHUB_OUTPUT"
      - name: Hitung frame range untuk shard ini
        id: range
        run: |
          node -e '
            const total = ${{ needs.bounds.outputs.total_frames }};
            const shardCount = ${{ github.event.inputs.shards }};
            const k = ${{ matrix.shard }};
            if (k >= shardCount) { console.log("start=0"); console.log("end=0"); process.exit(0); }
            const start = Math.floor((k * total) / shardCount);
            const end = Math.floor(((k + 1) * total) / shardCount);
            console.log("start=" + start);
            console.log("end=" + end);
          ' >> "$GITHUB_OUTPUT"
      - name: Render frame range
        if: ${{ matrix.shard < fromJSON(github.event.inputs.shards) }}
        working-directory: spine_renderer
        env:
          MODE: frames
          ASSET: ${{ steps.asset.outputs.path }}
          BOUNDS_FILE: ${{ github.workspace }}/spine_renderer/output/bounds.json
          FRAMES_OUT: ${{ github.workspace }}/spine_renderer/output/frames
          FRAME_START: ${{ steps.range.outputs.start }}
          FRAME_END: ${{ steps.range.outputs.end }}
          ACTION: ${{ github.event.inputs.action_name }}
          ACTION_DURATION: ${{ github.event.inputs.action_duration }}
          IDLE: ${{ github.event.inputs.idle_name }}
          IDLE_DURATION: ${{ github.event.inputs.idle_duration }}
          FPS: ${{ github.event.inputs.fps }}
          ALPHA: ${{ github.event.inputs.format == 'webm' && '1' || '0' }}
          CHROMA_COLOR: ${{ github.event.inputs.format == 'chromakey' && github.event.inputs.chroma_color || '' }}
        run: node render_mp4.js
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.shard < fromJSON(github.event.inputs.shards) }}
        with:
          name: frames-shard-${{ matrix.shard }}
          path: spine_renderer/output/frames
          retention-days: 1

  encode:
    needs: [bounds, frames]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-shard-*
          path: merged
          merge-multiple: true
      - name: Encode MP4
        run: |
          SCALE="${{ github.event.inputs.scale_percent }}"
          MAXDIM="${{ github.event.inputs.max_dimension }}"
          FILTER=""
          if [ -n "$MAXDIM" ]; then
            # Sisi TERPENDEK (lebar ATAU tinggi, mana yang lebih kecil) dipatok
            # persis ke MAXDIM pixel, sisi satunya (yang lebih panjang) ikut
            # membesar proporsional. Ini memastikan kedua sisi tidak pernah
            # jatuh ke angka kecil (misal mepet 1000), walau aspect ratio
            # karakternya sangat memanjang.
            FILTER="scale='if(lt(iw,ih),${MAXDIM},-2)':'if(lt(iw,ih),-2,${MAXDIM})'"
          elif [ -n "$SCALE" ]; then
            FILTER="scale=trunc(iw*${SCALE}/100/2)*2:trunc(ih*${SCALE}/100/2)*2"
          fi

          FORMAT="${{ github.event.inputs.format }}"
          VF_ARGS=()
          if [ -n "$FILTER" ]; then
            echo "Resize aktif: $FILTER"
            VF_ARGS=(-vf "$FILTER")
          else
            echo "Tidak ada MAX_DIM/SCALE, pakai resolusi asli (native, tanpa resize)."
          fi

          if [ "$FORMAT" = "webm" ]; then
            echo "Encode WebM (VP9, background TRANSPARAN)..."
            ffmpeg -y -framerate ${{ github.event.inputs.fps }} \
              -i merged/frame_%06d.png \
              "${VF_ARGS[@]}" \
              -an -c:v libvpx-vp9 -pix_fmt yuva420p -crf ${{ github.event.inputs.crf }} -b:v 0 \
              -colorspace bt709 -color_primaries bt709 -color_trc bt709 -color_range tv \
              -auto-alt-ref 0 \
              output.webm
            OUTFILE="output.webm"
          else
            if [ "$FORMAT" = "chromakey" ]; then
              echo "Encode MP4 (H.264, background warna solid '${{ github.event.inputs.chroma_color }}' - key manual di app editor)..."
            else
              echo "Encode MP4 (H.264, background HITAM - MP4 tidak support transparansi)..."
            fi
            ffmpeg -y -framerate ${{ github.event.inputs.fps }} \
              -i merged/frame_%06d.png \
              "${VF_ARGS[@]}" \
              -an -c:v libx264 -preset ${{ github.event.inputs.preset }} -crf ${{ github.event.inputs.crf }} -pix_fmt yuv420p \
              -colorspace bt709 -color_primaries bt709 -color_trc bt709 -color_range tv \
              -movflags +faststart \
              output.mp4
            OUTFILE="output.mp4"
          fi
          echo "OUTFILE=$OUTFILE" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: ${{ env.OUTFILE }}
          retention-days: 90
      - name: Hapus artifact sementara (frames-shard-* & bounds-data)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name | test("^frames-shard-|^bounds-data$")) | .id' \
          | while read -r id; do
              echo "Menghapus artifact id=$id ..."
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
            done
